services:
  user-service:
    build: ./user-service
    ports: ["3001:3001"]
  item-service:
    build: ./item-service
    ports: ["3002:3002"]
    environment:
      REALTIME_URL: http://realtime-service:3005
      PAYMENT_URL: http://payment-service:3004
  bid-service:
    build: ./bid-service
    ports: ["3003:3003"]
    environment:
      ITEM_URL: http://item-service:3002
      REALTIME_URL: http://realtime-service:3005
  payment-service:
    build: ./payment-service
    ports: ["3004:3004"]
  realtime-service:
    build: ./realtime-service
    ports: ["3005:3005"]
